[tox]
env_list =
    py313-lint
    py313-package
    py3{10,11,12}-tf{218,219,220}
    py3{10,11,12}-tf{218,219,220}-torch{25}
    py3{10,11,12,13}-tf{220}-torch{210}
    py3{13}-tf{220}
    py3{13}-torch{210}-yolo

# Tensoflow-only tests (no PyTorch required)
[testenv]
description = Run TensorFlow-only tests (no PyTorch required)
constrain_package_deps = true
extras =
    retinanet
setenv =
    XDG_CACHE_HOME = {toxworkdir}/cache
    PIP_CACHE_DIR = {toxworkdir}/pip_cache
    UV_CACHE_DIR = {toxworkdir}/uv_cache
deps =
    pytest
    pytest-cov
    tf218: tensorflow==2.18.0
    tf219: tensorflow==2.19.0
    tf220: tensorflow==2.20.0
package = editable

commands = pytest --cov=xplique_adapters \
    --ignore=tests/concepts/test_detr_craft.py \
    --ignore=tests/concepts/test_fasterrcnn_craft.py \
    --ignore=tests/concepts/test_fcos_craft.py \
    --ignore=tests/concepts/test_ssd_craft.py \
    --ignore=tests/concepts/test_yolo_craft.py \
    --ignore=tests/object_detection/test_detr.py \
    --ignore=tests/object_detection/test_torchvision.py \
    --ignore=tests/object_detection/test_yolo.py \
    tests --disable-warnings --no-cov {posargs}

# PyTorch tests with different TensorFlow and PyTorch versions
[testenv:py3{10,11,12}-tf{218,219,220}-torch{25}]
description = Run PyTorch tests with different TensorFlow and PyTorch versions
deps =
    pytest
    pytest-cov
    tf218: tensorflow==2.18.0
    tf219: tensorflow==2.19.0
    tf220: tensorflow==2.20.0
    torch25: torch==2.5.0
    torch25: torchvision==0.20.0
package = editable

commands = pytest --cov=xplique_adapters \
    tests/concepts/test_detr_craft.py \
    tests/concepts/test_fasterrcnn_craft.py \
    tests/concepts/test_fcos_craft.py \
    tests/concepts/test_ssd_craft.py \
    tests/object_detection/test_detr.py \
    tests/object_detection/test_torchvision.py \
    --ignore=tests/concepts/test_yolo_craft.py \
    --ignore=tests/object_detection/test_yolo.py \
    --disable-warnings --no-cov {posargs}

[testenv:py3{10,11,12,13}-tf{220}-torch{210}]
description = Run PyTorch tests with PyTorch 2.10 and TensorFlow 2.20
deps =
    pytest
    pytest-cov
    tf220: tensorflow==2.20.0
    torch210: torch==2.10.0
    torch210: torchvision==0.25.0
package = editable

commands = pytest --cov=xplique_adapters \
    tests/concepts/test_detr_craft.py \
    tests/concepts/test_fasterrcnn_craft.py \
    tests/concepts/test_fcos_craft.py \
    tests/concepts/test_ssd_craft.py \
    tests/object_detection/test_detr.py \
    tests/object_detection/test_torchvision.py \
    --ignore=tests/concepts/test_yolo_craft.py \
    --ignore=tests/object_detection/test_yolo.py \
    --disable-warnings --no-cov {posargs}

# YOLO-specific tests
[testenv:py3{13}-torch{210}-yolo]
description = Run YOLO-specific PyTorch tests
extras = yolo
deps =
    pytest
    pytest-cov
    torch210: torch==2.10.0
    torch210: torchvision==0.25.0
    tensorflow==2.20.0
    ultralytics==8.4.120
    matplotlib<3.9  # overcomplete uses plt.cm.get_cmap() removed in matplotlib 3.9
package = editable

commands = pytest --cov=xplique_adapters \
    tests/concepts/test_yolo_craft.py \
    tests/object_detection/test_yolo.py \
    --disable-warnings --no-cov {posargs}

[testenv:py313-lint]
description = Run linters on the codebase
deps =
    ruff
commands =
    ruff check xplique_adapters
    ruff format xplique_adapters --check
skip_install = true

[testenv:py313-package]
description = Build and validate the package artifacts
deps =
    build
    twine
    check-wheel-contents
commands =
    python -m build
    twine check dist/*
    check-wheel-contents dist/*.whl
skip_install = true
