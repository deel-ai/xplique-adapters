[bumpversion]
current_version = 0.1.0
commit = True
tag = False

[bumpversion:file:setup.py]

[bumpversion:file:xplique_adapters/__init__.py]

[pylint]
disable = 
	R0903, # allows to expose only one public method
	R0914, # allow multiples local variables
	E0401, # pending issue with pylint see pylint#2603
	E1123, # issues between pylint and tensorflow since 2.2.0
	E1120, # see pylint#3613
	E1101, # pylint misses members set dynamically
	C3001, # lambda function as variable
	R0917, # too-many-positional-arguments - TODO: fix this when breaking retrocompatibility

[pylint.FORMAT]
max-line-length = 100
max-args = 12

[similarities]
min-similarity-lines = 6
ignore-comments = yes
ignore-docstrings = yes
ignore-imports = no
ignore-signatures = yes

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
	-v
	--tb=short
	--strict-markers
markers =
	detr: tests requiring DETR model (transformers library)
	retinanet: tests requiring RetinaNet model (keras_cv library)
	yolo: tests requiring YOLO model (ultralytics library)
	torchvision: tests requiring torchvision models
	cuda: tests requiring CUDA/GPU
	slow: slow-running integration tests
norecursedirs = .git .tox dist build *.egg xplique_adapters.egg-info

[coverage:run]
source = xplique_adapters
omit = 
	*/tests/*
	*/test_*.py

[coverage:report]
exclude_lines =
	pragma: no cover
	def __repr__
	raise AssertionError
	raise NotImplementedError
	if __name__ == .__main__.:
	if TYPE_CHECKING:
	@abstractmethod

[mypy]
check_untyped_defs = True
warn_unused_configs = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True
